(()=>{'use strict';const defaults=['Liam','Ludvig','Jens','Olav','Svein','Kristian','Leander','Ahmed','Lukas'].map((name,i)=>({id:'default'+i,name,active:true,keeper:!['Lukas','Kristian','Leander'].includes(name),level:3}));let players;try{players=JSON.parse(localStorage.getItem('sf_players_v4'))||defaults}catch{players=defaults}let step=0,duration=25,mode='balanced',swapCount=2,keeperCount=1,drawNumber=1,plan=null,run=false,elapsed=0,startedAt=0,tickId=null,nextAlarm=1,alertText='',audio=null;const $=id=>document.getElementById(id);const save=()=>{try{localStorage.setItem('sf_players_v4',JSON.stringify(players))}catch{}};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const active=()=>players.filter(p=>p.active&&p.name.trim());const possible=()=>active().filter(p=>p.keeper);const name=id=>players.find(p=>p.id===id)?.name||'?';const fmt=t=>`${Math.floor(t/60).toString().padStart(2,'0')}:${Math.floor(t%60).toString().padStart(2,'0')}`;function head(n,title,desc){return `<div class="step">STEG ${n} AV 5</div><h2 class="headline">${title}</h2><p class="sub">${desc}</p>`}function buttons(back=true,forward=true){return `<div class="nav">${back?'<button class="btn secondary" id="back">← Tilbake</button>':''}${forward?'<button class="btn" id="next">Neste steg →</button>':''}</div>`}function render(){if(run&&step!==4){run=false;clearInterval(tickId)}$('progress').innerHTML=[0,1,2,3,4].map(i=>`<button aria-label="Steg ${i+1}" class="${i===step?'active':i<step?'past':''}" data-step="${i}"></button>`).join('');let html='';if(step===0){html=head(1,'Hvem er med?','Velg kampens spillere, sett nivå fra 1–5 og huk av hvem som kan stå i mål. Du kan endre navn eller legge til nye.');html+=`<div class="panel"><div class="panel-title">Spillerstall <span class="tag">${active().length} påmeldte</span></div><div class="roster">${players.map(p=>`<div class="player ${p.active?'':'off'}"><input class="tick" type="checkbox" aria- function rng(seed){let s=(seed>>>0)||1;return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296}}function shuffle(arr,r){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function choose4(arr){let out=[];for(let a=0;a<arr.length;a++)for(let b=a+1;b<arr.length;b++)for(let c=b+1;c<arr.length;c++)for(let d=c+1;d<arr.length;d++)out.push([arr[a],arr[b],arr[c],arr[d]]);return out}function generate(seed){

}
function chooseN(arr,n){if(n===0)return [[]];if(n>arr.length)return [];const out=[];const walk=(start,part)=>{if(part.length===n){out.push([...part]);return}for(let i=start;i<arr.length;i++)walk(i+1,[...part,arr[i]])};walk(0,[]);return out}
function bindTimer(){$('toggle').onclick=()=>{if(run){elapsed=Math.min(duration*60,elapsed+(Date.now()-startedAt)/1000);run=false;clearInterval(tickId)}else{if(elapsed>=duration*60)elapsed=0;startedAt=Date.now();run=true;audioInit();tickId=setInterval(updateClock,200)}renderClock();$('toggle').textContent=run?'⏸ Pause':'▶ Start'};$('reset').onclick=()=>{run=false;clearInterval(tickId);elapsed=0;nextAlarm=1;alertText='';renderClock();$('toggle').textContent='▶ Start'};$('testSound').onclick=()=>{audioInit();beep()};$('copy').onclick=()=>{const txt=`STARTFEMMER – ${duration} min\nKeepere: ${plan.keeperRotation.map(name).join(', ')}\n`+plan.slots.map(s=>`${fmt(s.from*60)}–${fmt(s.to*60)}: 🧤 ${name(s.keeper)} | ${s.field.map(name).join(', ')}${s.in.length?' | Inn: '+s.in.map(name).join(', ')+' | Ut: '+s.out.map(name).join(', '):''}`).join('\n');navigator.clipboard?.writeText(txt).then(()=>alert('Kampplan kopiert!')).catch(()=>prompt('Kopier kampplan:',txt))};renderClock()}
function audioInit(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch{}}function beep(){try{if(!audio)return;[0,.25,.5].forEach((t,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=i===2?960:750;g.gain.setValueAtTime(.001,audio.currentTime+t);g.gain.exponentialRampToValueAtTime(.24,audio.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+t+.2);o.connect(g).connect(audio.destination);o.start(audio.currentTime+t);o.stop(audio.currentTime+t+.22)})}catch{}if(navigator.vibrate)navigator.vibrate([300,150,300])}function updateClock(){if(!run)return;const t=Math.min(duration*60,elapsed+(Date.now()-startedAt)/1000);while(nextAlarm<plan.slots.length&&t>=plan.slots[nextAlarm].from*60){const s=plan.slots[nextAlarm];alertText=`${s.keeper!==plan.slots[nextAlarm-1].keeper?'KEEPERBYTTE! '+name(s.keeper)+' i mål. ':'BYTTE NÅ! '}Inn: ${s.in.map(name).join(', ')||'Ingen'} · Ut: ${s.out.map(name).join(', ')||'Ingen'}`;beep();nextAlarm++}if(t>=duration*60){elapsed=duration*60;run=false;clearInterval(tickId);alertText='SLUTT! Kampen er ferdig.';beep()}renderClock()}function renderClock(){if(!$('clock'))return;const t=run?Math.min(duration*60,elapsed+(Date.now()-startedAt)/1000):elapsed;$('clock').innerHTML=`${fmt(t)} <small>/ ${fmt(duration*60)}</small>`;$('alarmBox').innerHTML=alertText?`<div class="alert"><strong>🔔 ${esc(alertText)}</strong><div style="margin-top:10px"><button class="btn secondary" id="dismiss">OK, forstått</button></div></div>`:'';if($('dismiss'))$('dismiss').onclick=()=>{alertText='';renderClock()};plan.slots.forEach((s,i)=>{const el=$('slot'+i);if(el)el.classList.toggle('current',t>=s.from*60&&t<s.to*60)})}
render();})();
</script></body></html>
